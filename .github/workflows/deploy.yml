name: Deploy dinuge.dk to one.com Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync Webspace via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to one.com via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ONECOM_SFTP_HOST }}
          username: ${{ secrets.ONECOM_SFTP_USER }}
          password: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          port: ${{ secrets.ONECOM_SFTP_PORT || 22 }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.ONECOM_SFTP_REMOTE_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.venv/**
            blueprint.json
            README.md
